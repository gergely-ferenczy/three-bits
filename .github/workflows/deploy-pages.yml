name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout three-bits-docs
        uses: actions/checkout@v7
        with:
          repository: gergely-ferenczy/three-bits-docs
          path: three-bits-docs

      - name: Checkout three-bits
        uses: actions/checkout@v7
        with:
          path: three-bits

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            three-bits/package-lock.json
            three-bits-docs/package-lock.json

      - name: Install three-bits dependencies
        run: npm ci --ignore-scripts
        working-directory: three-bits

      - name: Install three-bits-docs dependencies
        run: npm ci --ignore-scripts
        working-directory: three-bits-docs

      - name: Build docs
        run: npm run build
        working-directory: three-bits-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: three-bits-docs/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
